# Minimal static-file server config for the Vite build output
# (docs/operations/container-conventions.md rules 1/2/4: this runs under
# nginxinc/nginx-unprivileged, non-root by default, on an unprivileged
# port; the only writable paths nginx itself needs -- cache/pid/tmp under
# /var/cache/nginx and /var/run -- are mounted as tmpfs by
# docker-compose.local.yml rather than left as a writable root filesystem).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routed SPA: an unknown path falls back to index.html
    # rather than a bare nginx 404, so the app's own router (not nginx)
    # decides what an unmatched route means.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
