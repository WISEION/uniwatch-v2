# CI gates (task 0.D, qa): Fast (Gate 1) and Full (Gate 2) per
# docs/reports/PLAN-MISSION-1.md §2 / master plan §22. See .ci/README.md
# for what each gate covers and what is still a stub (security scans,
# RC/production gates -- those are 0.D's plan for later, not this job).
#
# GitHub Actions is an implementation choice, not a locked decision from the
# source docs (no PRD/master-plan section names a CI vendor) -- recorded in
# docs/decisions/OPEN-QUESTIONS.md rather than decided silently.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  fast:
    name: Fast gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      # FR-MIG-04, NEG-01, NEG-02 -- v1 must never be touched by v2.
      - name: v1 untouched
        run: python tools/check_v1_untouched.py

      - name: format (ruff format --check)
        run: python -m ruff format --check .
      - name: lint (ruff check)
        run: python -m ruff check .
      - name: typecheck (mypy)
        run: python -m mypy packages apps

      # Pure logic only -- no DB/network (tests/README.md).
      - name: unit tests
        run: python -m pytest tests/unit -q

      # Contract-first sanity check (FR-PLT-01): the OpenAPI schema each app
      # actually serves must build without error. Does not need a DB --
      # both apps create their engine lazily (see apps/api_tender/main.py's
      # and apps/api_vendor/main.py's module docstrings).
      - name: API schemas validate (tender + vendor)
        run: |
          python -c "
          from apps.api_tender.main import app as tender_app
          from apps.api_vendor.main import app as vendor_app
          for name, app in [('tender', tender_app), ('vendor', vendor_app)]:
              schema = app.openapi()
              assert schema['paths'], f'{name} OpenAPI schema has no paths'
              print(f'{name} OpenAPI OK: {len(schema[\"paths\"])} path(s)')
          "

      # Migration syntax (FR-PLT-12): every migrations/*.sql file must at
      # least parse (NNNN_description.sql naming, readable, hashable) --
      # this does not apply DDL or need a DB, that is the Full gate's
      # migration-rehearsal test (tests/integration/test_migrations_runner.py).
      - name: migration files parse
        run: |
          python -c "
          from pathlib import Path
          from packages.platform.migrations_runner import MigrationRunner
          migrations = MigrationRunner('', Path('migrations')).discover()
          assert migrations, 'no migrations found'
          print(f'{len(migrations)} migration file(s) parsed OK')
          "

  full:
    name: Full gate
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Phase 6 task 6.B's restore-drill test (tests/integration/test_restore_drill.py)
      # shells out to the real pg_dump/pg_restore binaries -- ubuntu-latest's
      # runner image already carries these, but pin the install explicitly
      # rather than relying on an undocumented runner-image detail.
      - name: install postgresql-client (pg_dump/pg_restore for the restore drill)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # tests/integration spins up its own Postgres via testcontainers,
      # which talks to the runner's Docker daemon directly (available by
      # default on GitHub-hosted runners) -- no `services:` block needed.
      # contract/state/security/e2e/performance are empty skeletons per
      # tests/README.md -- this collects and runs whatever exists there
      # today and grows as Phase 1+ adds real tests to those suites.
      #
      # `-m "not live_network"` excludes tests that make a real network call
      # to etender.gov.az: confirmed 2026-08-05 (docs/decisions/OPEN-QUESTIONS.md)
      # that host blocks TCP connects from GitHub Actions' IP ranges (DNS
      # resolves fine, a control request to a different real host succeeds --
      # this is host-side firewalling, not CI flakiness). Those tests still
      # run, informationally, in the `live-fetch` job below.
      - name: full suite (integration + any contract/state/security/e2e present)
        run: python -m pytest tests/ -q -m "not live_network"

  build-images:
    # Pipeline *mechanics* only (Phase 6 task 6.A's hosting-topology
    # sub-task): builds each of the four real-service Dockerfiles and
    # records their content digests. D-HOST resolved to local-network-only
    # (docs/decisions/OPEN-QUESTIONS.md) -- there is no registry to push to
    # yet, so these are local `docker build`s, not a publish step. This
    # seeds the "Image digest integrity" (NFR-SEC-09) line in
    # .ci/README.md's Gate 3/4 stub table; the production-authorization
    # gate that actually checks a deployed digest against this manifest is
    # Phase 6 task 6.B, not this job.
    name: Build service images + release manifest
    runs-on: ubuntu-latest
    needs: [fast, full]
    env:
      # NOT bare github.sha: on a pull_request-triggered run, github.sha is
      # GitHub's own ephemeral test-merge commit (a preview of the PR merged
      # into its base), which never persists in repo history once the PR
      # closes -- it matches neither the PR's real head commit nor its
      # eventual merge commit. A release-manifest.json built from that value
      # can never be matched against anything real afterward, defeating the
      # whole "commit<->digest proof" Gate 4 exists to check (found and
      # fixed in task 6.B, verified against this repo's own PR #39: its
      # manifest's recorded commit_sha matched neither `head.sha` nor
      # `merge_commit_sha`). On push (e.g. after merge to master), github.sha
      # is a real, permanent commit, so the fallback is exact and harmless.
      IMAGE_TAG: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build api_tender image
        run: docker build -f apps/api_tender/Dockerfile -t "uniwatch/api_tender:$IMAGE_TAG" .
      - name: Build api_vendor image
        run: docker build -f apps/api_vendor/Dockerfile -t "uniwatch/api_vendor:$IMAGE_TAG" .
      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t "uniwatch/worker:$IMAGE_TAG" .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t "uniwatch/web:$IMAGE_TAG" apps/web

      # docs/operations/release-manifest.md documents this shape. Digest =
      # `docker inspect`'s .Id: a local content digest of the built image,
      # not a registry distribution digest (there is nothing to push to).
      - name: Write release-manifest.json
        run: |
          python -c "
          import json
          import os
          import subprocess
          from datetime import UTC, datetime

          tag = os.environ['IMAGE_TAG']
          images = {
              'api_tender': f'uniwatch/api_tender:{tag}',
              'api_vendor': f'uniwatch/api_vendor:{tag}',
              'worker': f'uniwatch/worker:{tag}',
              'web': f'uniwatch/web:{tag}',
          }
          digests = {
              name: subprocess.check_output(
                  ['docker', 'inspect', '--format={{.Id}}', image], text=True
              ).strip()
              for name, image in images.items()
          }
          manifest = {
              'commit_sha': tag,
              'images': digests,
              'built_at': datetime.now(UTC).isoformat(),
          }
          with open('release-manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
              f.write('\n')
          print(json.dumps(manifest, indent=2))
          "

      - name: Upload release-manifest.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json

  security-scan:
    # Phase 6 task 6.B Task 4 (NFR-SEC-07, threat-model T6): the
    # dependency-scan (SCA)/license-scan/SBOM row of .ci/README.md's Gate 3
    # stub plan, wired for real. `needs: fast` only (not `full`) -- none of
    # these three steps touch the DB, so there is no reason to wait on the
    # testcontainers-backed Full gate.
    name: Security scan (SCA + license + SBOM)
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      # Dependency vulnerability scan (SCA) against the resolved dependency
      # set. Informational only for now, per .ci/README.md's own recorded
      # rollout plan ("Full gate initially ... promoted to a Fast-gate
      # blocker once the baseline is clean") -- this is the *first* run, so
      # there is no established clean baseline yet (confirmed locally:
      # pip-audit currently reports real findings against pip/pytest/
      # starlette's pinned versions). `|| true` plus `continue-on-error`
      # both guard against the step's exit code failing the job, matching
      # the "not ready to be a hard gate yet" posture `live-fetch` already
      # uses elsewhere in this file for a similar reason.
      - name: dependency vulnerability scan (pip-audit) -- informational only, no clean baseline yet
        continue-on-error: true
        run: |
          pip-audit --format json --output pip-audit-report.json || true
          echo "--- pip-audit summary ---"
          python -c "
          import json
          try:
              report = json.load(open('pip-audit-report.json'))
          except FileNotFoundError:
              print('pip-audit produced no report file (unexpected) -- see step log above')
          else:
              deps = report.get('dependencies', []) if isinstance(report, dict) else report
              total = 0
              for dep in deps:
                  vulns = dep.get('vulns') or []
                  if vulns:
                      total += len(vulns)
                      ids = ', '.join(v['id'] for v in vulns)
                      print(f\"  {dep['name']} {dep['version']}: {len(vulns)} known vuln(s) ({ids})\")
              print(f'Total: {total} known vulnerability record(s). Informational only -- see .ci/README.md Gate 3 row; not yet a blocking gate.')
          "

      - name: Upload pip-audit report artifact
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json

      # License scan: real pass/fail gate, no "clean baseline" ambiguity
      # (unlike the vulnerability scan above). `--ignore-packages` excludes:
      #   - uniwatch-v2 itself (this project's own code carries no PyPI
      #     license classifier yet, so pip-licenses reports it as UNKNOWN --
      #     that is not a third-party license to allow-list, so it is
      #     excluded rather than added to the allow-list as a fake "UNKNOWN"
      #     entry).
      #   - chardet, which is LGPL-2.1 -- pulled in solely as a transitive
      #     dependency of cyclonedx-bom itself (confirmed locally via
      #     `pip show chardet`: "Required-by: cyclonedx-bom"), never
      #     imported by any apps/packages code, and never installed in a
      #     production image (apps/*/Dockerfile run `pip install .`, not
      #     `.[dev]` -- the dev extra, and everything only reachable through
      #     it, never ships). Excluding it here is a distribution-scope
      #     judgment call, not a silent override: if chardet (or any other
      #     LGPL package) ever becomes a direct or production dependency,
      #     this exclusion must be revisited.
      # Verified locally (2026-08-16) against this repo's actual resolved
      # dev-dependency set: every other installed package's license falls
      # into this allow-list; the check exits 0.
      - name: license scan (pip-licenses, explicit allow-list)
        run: |
          pip-licenses \
            --ignore-packages uniwatch-v2 chardet \
            --allow-only "Apache Software License;Apache-2.0;Apache Software License; BSD License;Apache-2.0 OR BSD-2-Clause;BSD License;BSD-2-Clause;BSD-3-Clause;ISC License (ISCL);MIT;MIT License;MIT-0;MIT AND PSF-2.0;Mozilla Public License 2.0 (MPL 2.0);PSF-2.0;Python Software Foundation License"

      - name: Generate license report artifact
        run: pip-licenses --format=markdown --output-file licenses-report.md

      - uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: licenses-report.md

      # SBOM (CycloneDX JSON) for this project's resolved environment --
      # `cyclonedx-py` is the CLI installed by the `cyclonedx-bom` package.
      - name: generate SBOM (CycloneDX JSON)
        run: cyclonedx-py environment -o sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  live-fetch:
    # Deliberately NOT a required status check (not in `needs` for anything,
    # not named in branch protection) -- etender.gov.az is confirmed
    # unreachable from GitHub-hosted runners (docs/decisions/OPEN-QUESTIONS.md,
    # 2026-08-05), so requiring this to pass would permanently block every
    # PR. Runs informationally so a real regression in the egress/connector
    # code itself is still visible to whoever runs these locally or on a
    # network path that can actually reach the host.
    name: live-fetch (best-effort, not required)
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: live_network-marked tests (etender.gov.az -- expected to fail from this runner)
        run: python -m pytest tests/ -q -m live_network
