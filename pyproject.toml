[project]
name = "uniwatch-v2"
version = "0.0.0"
description = "UNIWatch v2 — Tender / Vendor / Decision intelligence (modular monolith)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "httpx==0.28.1",
  "testcontainers[postgres]==4.9.0",
  "ruff==0.16.1",
  "mypy==2.3.0",
]

[tool.setuptools.packages.find]
include = ["packages*", "apps*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "live_network: makes a real network call to a host confirmed unreachable from GitHub-hosted CI runners (etender.gov.az blocks TCP connects from GitHub Actions IP ranges, confirmed 2026-08-05 -- see docs/decisions/OPEN-QUESTIONS.md). Full gate excludes these; a separate non-blocking CI job runs them.",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF"]
# B008 (function call in a default argument) is a false positive for the
# FastAPI `Depends(...)`/`Header(...)` idiom used throughout apps/api and
# packages/platform/rbac — that pattern is how FastAPI's DI is meant to be
# used, not a bug bugbear should flag here.
# RUF001/RUF002/RUF003 (ambiguous Unicode characters, e.g. dotless ı) exist
# to catch homoglyph confusables in identifiers/strings — but this
# project's real domain data is Azerbaijani source text (tender names,
# keyword-classifier comments, test fixtures grounded in real captures),
# where these characters are legitimate content, not an attack surface.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
